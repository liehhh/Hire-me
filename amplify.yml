version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # NEXT_PUBLIC_SERVER_URL (the Lambda Function URL) must be set as an
            # Amplify environment variable: Next.js inlines it at build time.
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    # Same headers as next.config.mjs; they enable SharedArrayBuffer for the
    # multithreaded Kokoro voice model.
    customHeaders:
      - pattern: "**"
        headers:
          - key: Cross-Origin-Opener-Policy
            value: same-origin
          - key: Cross-Origin-Embedder-Policy
            value: credentialless
